# GDD §10.3, §4 step 5; TR §6: a wave clears when every scheduled robot has spawned and none
# remain. Non-final clears pay the wave-cleared coin; `openShop` then `nextWave` start the next
# wave. The shop is the only way tiles enter a run (GDD §10.5).
name: wave clear pays coins; openShop then nextWave starts the next wave
mode: run
baseValue: 5
board:
  - ". . . . . . . ."
  - ". . . . . . . ."
  - "C R5 . . . . . ."
  - ". . . . . . . ."
  - ". . . . . . . ."
waves:
  - id: wave-1
    spawns:
      - { turn: 1, lane: 0, robot: basic, hp: [1, 1] }
  - id: wave-2
    spawns:
      - { turn: 1, lane: 0, robot: basic, hp: [4, 4] }
commands:
  - endTurn
  - openShop
  - nextWave
expectEvents:
  - { type: RobotDefeated, exact: true }
  - { type: CoinsChanged, reason: exactKill, delta: 2 }
  - { type: WaveCleared, waveIndex: 0 }
  - { type: CoinsChanged, reason: waveCleared, delta: 3 }
  - { type: RobotSpawned, at: { lane: 0, col: 7 }, hp: 4, maxHp: 4 }
expectState:
  phase: planning
  waveIndex: 1
  turn: 1
  coins: 5
  tray: []
  shop: null
