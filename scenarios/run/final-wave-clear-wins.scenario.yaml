# GDD §10.1, §10.6; TR §6: clearing the last wave in the (scenario's own) wave list wins the run
# instead of granting a reward — no shop/reward slot after the final wave.
name: the final wave clear wins the run, with no TilesGranted
mode: run
baseValue: 5
board:
  - ". . . . . . . ."
  - ". . . . . . . ."
  - "C R5 . . . . . ."
  - ". . . . . . . ."
  - ". . . . . . . ."
waves:
  - id: only-wave
    spawns:
      - { turn: 1, lane: 0, robot: basic, hp: [1, 1] }
commands:
  - endTurn
expectEvents:
  - { type: RobotDefeated, exact: true }
  - { type: WaveCleared, waveIndex: 0 }
  - { type: CoinsChanged, reason: waveCleared, delta: 3 }
  - { type: RunWon }
expectState:
  phase: won
  tray: []
