# Pack 1 tutorial: the old eight teaching beats as one 5-wave scenario.
name: warm up
puzzle: warm-up
commands:
  - endTurn
  - nextWave
  - { type: moveCannon, fromLane: 2, toLane: 3 }
  - { type: placeTile, pieceId: "piece:0", to: { lane: 3, col: 1 } }
  - endTurn
  - nextWave
  - { type: moveCannon, fromLane: 3, toLane: 2 }
  - { type: placeTile, pieceId: "piece:1", to: { lane: 2, col: 1 } }
  - { type: placeTile, pieceId: "piece:2", to: { lane: 2, col: 2 } }
  - endTurn
  - nextWave
  - { type: returnTile, from: { lane: 3, col: 1 } }
  - { type: returnTile, from: { lane: 2, col: 1 } }
  - { type: returnTile, from: { lane: 2, col: 2 } }
  - { type: moveCannon, fromLane: 2, toLane: 1 }
  - { type: placeTile, pieceId: "piece:4", to: { lane: 1, col: 1 } }
  - endTurn
  - { type: moveCannon, fromLane: 1, toLane: 3 }
  - { type: placeTile, pieceId: "piece:3", to: { lane: 3, col: 1 } }
  - { type: placeTile, pieceId: "piece:2", to: { lane: 3, col: 2 } }
  - endTurn
  - nextWave
  - { type: moveCannon, fromLane: 3, toLane: 2 }
  - { type: placeTile, pieceId: "piece:7", to: { lane: 2, col: 1 } }
  - { type: placeTile, pieceId: "piece:5", to: { lane: 2, col: 2 } }
  - { type: placeTile, pieceId: "piece:6", to: { lane: 2, col: 3 } }
  - endTurn
expectEvents:
  - { type: RobotDefeated, exact: true }
  - { type: WaveCleared, waveIndex: 0 }
  - { type: RobotDefeated, exact: true }
  - { type: WaveCleared, waveIndex: 1 }
  - { type: RobotDefeated, exact: true }
  - { type: WaveCleared, waveIndex: 2 }
  - { type: RobotDefeated, exact: true }
  - { type: RobotDefeated, exact: true }
  - { type: WaveCleared, waveIndex: 3 }
  - { type: RobotDefeated, exact: true }
  - { type: RunWon }
expectState:
  phase: won
  mode: puzzle
  puzzleId: warm-up
