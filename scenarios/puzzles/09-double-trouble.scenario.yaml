name: double trouble
puzzle: double-trouble
commands:
  - { type: placeTile, pieceId: "piece:0", to: { lane: 2, col: 1 } }
  - endTurn
  - nextWave
  - { type: placeTile, pieceId: "piece:1", to: { lane: 2, col: 2 } }
  - endTurn
  - nextWave
  - { type: returnTile, from: { lane: 2, col: 1 } }
  - { type: placeTile, pieceId: "piece:2", to: { lane: 2, col: 1 } }
  - endTurn
expectEvents:
  - { type: RobotDefeated, exact: true }
  - { type: WaveCleared, waveIndex: 0 }
  - { type: RobotDefeated, exact: true }
  - { type: WaveCleared, waveIndex: 1 }
  - { type: RobotDefeated, exact: true }
  - { type: RunWon }
expectState:
  phase: won
  puzzleId: double-trouble
