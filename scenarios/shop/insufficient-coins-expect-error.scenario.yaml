# GDD §8.6: a tap the player cannot afford is refused (no purchase).
name: buying with too few coins is insufficient_coins
mode: run
phase: shop
baseValue: 1
coins: 3
board:
  - "C . . . . . . ."
  - ". . . . . . . ."
  - ". . . . . . . ."
  - ". . . . . . . ."
  - ". . . . . . . ."
shop:
  - { slot: "tile:0", kind: tile, tileId: "add:5", price: 4, bought: false }
  - { slot: cannon, kind: cannon, price: 10, bought: false, available: true }
  - { slot: upgrade, kind: upgrade, price: 12, bought: false, fromValue: 1, toValue: 2 }
commands:
  - { buy: "tile:0" }
expectError: insufficient_coins
