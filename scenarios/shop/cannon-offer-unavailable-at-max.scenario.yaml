# GDD §8.6: the cannon offer is unavailable at maxCannons (`available: false`).
name: a cannon offer at max cannons is offer_unavailable
mode: run
phase: shop
baseValue: 1
coins: 50
cannons: [true, true, true, true, true]
board:
  - "C . . . . . . ."
  - ". . . . . . . ."
  - ". . . . . . . ."
  - ". . . . . . . ."
  - ". . . . . . . ."
shop:
  - { slot: "tile:0", kind: tile, tileId: "add:1", price: 4, bought: false }
  - { slot: cannon, kind: cannon, price: 30, bought: false, available: false }
  - { slot: upgrade, kind: upgrade, price: 12, bought: false, fromValue: 1, toValue: 2 }
commands:
  - { buy: cannon }
expectError: offer_unavailable
