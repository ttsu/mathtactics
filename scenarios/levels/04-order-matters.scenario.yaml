# Level 4 (task 11): order matters. The tray lists ×2 first, so placing tiles in tray order gives
# 1 × 2 + 5 = 7; the exact kill needs the +5 first: (1 + 5) × 2 = 12.
name: level 4 — (1 + 5) × 2 = 12
level: level-4
commands:
  - { type: placeTile, pieceId: "piece:1", to: { lane: 2, col: 1 } } # +5
  - { type: placeTile, pieceId: "piece:0", to: { lane: 2, col: 2 } } # ×2
  - endTurn
expectEvents:
  - { type: BallTransformed, tileId: "add:5", newValue: 6 }
  - { type: BallTransformed, tileId: "mul:2", newValue: 12 }
  - { type: RobotDefeated, exact: true }
  - { type: LevelCleared, levelId: level-4 }
expectState:
  phase: levelCleared
  coins: 2
