<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Math Tactics" />
    <meta name="theme-color" content="#2f3e57" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <title>Math Tactics</title>
    <style>
      /* Web shell (TR §15): no page scroll, bounce, zoom, text selection or callout on touch. */
      html,
      body {
        position: fixed;
        inset: 0;
        margin: 0;
        /* `clip`, not `hidden`: `hidden` still allows programmatic scrolling (scrollIntoView, focus),
           which can shift the board and the scaled #ui-root box (whose 1180×820 layout box overflows
           small viewports) out of alignment. `clip` forbids all scrolling. */
        overflow: clip;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        background: #1d2638;
      }

      #app {
        position: fixed;
        inset: 0;
        overflow: clip;
      }

      #board-root {
        position: absolute;
        inset: 0;
      }

      /* Sized and transformed from JS to track the canvas (game/main.tsx). */
      #ui-root {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        pointer-events: none;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="board-root"></div>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/game/main.tsx"></script>
  </body>
</html>
